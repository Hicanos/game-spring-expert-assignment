spring.application.name=game-expert

# --- MySQL (docker-compose: mysql 서비스, 3306 포트) ---
spring.datasource.url=jdbc:mysql://localhost:3306/game_expert?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root1234

# 엔티티(@Table, @Index 등)의 변경 사항을 DB 스키마에 자동 반영합니다.
# Lv2에서 @Table의 indexes 속성으로 인덱스를 선언하면, 이 옵션 덕분에
# 서버 기동 시 Hibernate가 실제 테이블/인덱스를 생성/수정합니다.
spring.jpa.hibernate.ddl-auto=update

# --- Redis (docker-compose: redis 서비스, 6379 포트) ---
spring.data.redis.host=localhost
spring.data.redis.port=6379
